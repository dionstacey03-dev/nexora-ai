<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="nexoraGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="nexoraCore" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark rounded backplate for high visibility on any tab -->
  <rect width="64" height="64" rx="16" fill="#080c14" />
  <rect width="64" height="64" rx="16" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5" />

  <!-- Outer faceted nexus polygon -->
  <path d="M32 8L54 20V44L32 56L10 44V20L32 8Z" stroke="url(#nexoraGrad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Inner crystalline facets -->
  <path d="M32 8L32 32M54 20L32 32M54 44L32 32M32 56L32 32M10 44L32 32M10 20L32 32" stroke="url(#nexoraGrad)" stroke-width="1.5" stroke-opacity="0.5" stroke-linejoin="round" />

  <!-- Central Intelligence Core Diamond -->
  <polygon points="32,22 42,32 32,42 22,32" fill="url(#nexoraCore)" filter="url(#glow)" />
  <circle cx="32" cy="32" r="3" fill="#ffffff" />
</svg>
